# Builds the Chinese localization of the latest upstream release.
#
# Nothing of this fork is merged into upstream. The job checks out this branch for the
# localization sources, clones the upstream release tag into a throwaway folder, applies the
# translations there (build/apply.py), builds the launcher, keeps the original SDL3 and publishes everything on a `zh-CN-v<version>-zh<revision>` tag.
name: localization

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Localization revision for this upstream version (bump to republish)'
        required: false
        default: '1'
  schedule:
    - cron: '30 3 * * *'
  push:
    branches: [zh-CN]
    paths:
      - 'localization/**'
      - '.github/workflows/localization.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      REVISION: ${{ github.event.inputs.revision || '1' }}
    steps:
      - uses: actions/checkout@v4
      - name: The upstream version to localize
        id: upstream
        run: |
          version=$(git ls-remote --tags --refs https://github.com/CaduGimenes/SanctuaryPort.git \
            | awk -F/ '{print $NF}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          [ -n "$version" ] || { echo 'no upstream release tag found' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=zh-CN-$version-zh$REVISION" >> "$GITHUB_OUTPUT"
      - name: Already published?
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh release view "${{ steps.upstream.outputs.tag }}" --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "${{ steps.upstream.outputs.tag }} exists; nothing to do"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Upstream checkout with the translations applied
        if: steps.published.outputs.skip == 'no'
        run: |
          git clone --depth 1 --branch "${{ steps.upstream.outputs.version }}" \
            https://github.com/CaduGimenes/SanctuaryPort.git upstream
          python3 localization/zh-CN/build/apply.py upstream
      - name: Download the upstream port package
        if: steps.published.outputs.skip == 'no'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          curl -fsSL --retry 3 -o port.zip \
            "https://github.com/CaduGimenes/SanctuaryPort/releases/download/$VERSION/SanctuaryPort-windows.zip"
      - name: Toolchain
        if: steps.published.outputs.skip == 'no'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 python3-pefile
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          source "$HOME/.cargo/env"
          (cd upstream/launcher-rust && rustup target add x86_64-pc-windows-gnu)
      - name: Build the launcher
        if: steps.published.outputs.skip == 'no'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          source "$HOME/.cargo/env"
          cd upstream/launcher-rust
          echo '1 ICON "assets/sanctuaryport.ico"' > launcher-icon.rc
          x86_64-w64-mingw32-windres -i launcher-icon.rc -o launcher-icon.o
          SANCTUARY_RELEASE_TAG="$TAG" \
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc \
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS="--remap-path-prefix=$HOME=~" \
            cargo rustc --locked --release --target x86_64-pc-windows-gnu --bin sanctuaryport-launcher -- -C "link-arg=$PWD/launcher-icon.o"
          /usr/bin/python3 ../../localization/zh-CN/build/check_icon.py target/x86_64-pc-windows-gnu/release/sanctuaryport-launcher.exe assets/sanctuaryport.ico
      - name: Package
        if: steps.published.outputs.skip == 'no'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          # The package carries the whole port, so a player on an older port updates in one
          # step instead of installing a port package by hand first.
          /usr/bin/python3.12 localization/zh-CN/build/package.py \
            --exe upstream/launcher-rust/target/x86_64-pc-windows-gnu/release/sanctuaryport-launcher.exe \
            --tag "$TAG" --out dist --port port.zip \
            --trophies upstream/assets/trophies/Diablo_III.json
          ls -l dist
      - uses: actions/upload-artifact@v4
        if: steps.published.outputs.skip == 'no'
        with:
          name: SanctuaryPort-launcher-zh-CN
          path: |
            dist/SanctuaryPort-launcher-zh-CN.zip
            dist/SanctuaryPort-launcher-zh-CN.zip.sha256
      - name: Publish
        if: steps.published.outputs.skip == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" \
            --notes "SanctuaryPort $VERSION 简体中文（汉化修订 $REVISION）"
          gh release upload "$TAG" dist/SanctuaryPort-launcher-zh-CN.zip \
              dist/SanctuaryPort-launcher-zh-CN.zip.sha256 --clobber
          gh release edit "$TAG" --draft=false --latest
