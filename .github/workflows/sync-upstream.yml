# Keeps `main` an exact copy of CaduGimenes/SanctuaryPort.
#
# The fork carries no upstream work of its own: everything this project adds lives on `zh-CN`
# (the localization sources) and is applied to a throwaway upstream checkout by the
# localization workflow. That is why this job can simply move `main` onto the upstream commit -
# nothing can conflict, and nobody has to merge by hand.
name: sync-upstream

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Follow upstream
        id: follow
        run: |
          git config user.name 'upstream sync'
          git config user.email 'actions@users.noreply.github.com'
          git fetch --no-tags https://github.com/CaduGimenes/SanctuaryPort.git main
          echo "upstream: $(git log --oneline -1 FETCH_HEAD)"
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "main already holds the upstream commit"
            echo "moved=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git reset --hard FETCH_HEAD
          git push --force origin main
          echo "moved=yes" >> "$GITHUB_OUTPUT"
      - name: Build the localization for the new upstream
        if: steps.follow.outputs.moved == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run localization.yml --ref zh-CN || echo "dispatch failed (the workflow may not be on zh-CN yet)"
